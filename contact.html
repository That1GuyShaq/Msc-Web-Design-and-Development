      <!-- Contact -->
      <section class="contact">
        <div class="container">
  
          <div class="section-title">
            <h2>Contact Josep Adams</h2>
          </div>
  
          <div class="row g-5">
            <div class="col-lg-5">
              <div class="card border-0 shadow">
                <div class="card-body">
                  <div class="row">
                    <div class="col-2 d-flex justify-content-center">
                      <i class="fa-solid fa-map-location"></i>
                    </div>
                    <div class="col-10">
                      <h4 class="mb-0 mt-1">Location</h4>
                      <h5 class="text-muted">London, UK</h5>
                    </div>

                    <div class="col-2 d-flex justify-content-center">
                      <i class="fa-solid fa-phone"></i>
                    </div>
                    <div class="col-10">
                      <h4 class="mb-0 mt-1">Telephone</h4>
                      <h5 class="text-muted">+9 (596) 742-1561</h5>
                    </div>
                  
                    <div class="col-2 d-flex justify-content-center">
                      <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="col-10">
                      <h4 class="mb-0 mt-1">Email</h4>
                      <h5 class="text-muted">contactme@josepadams.com</h5>
                    </div>

                    <div class="col-12">
                      <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3039.9819260510967!2d-64.7153464417093!3d8.84520551988523!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2stt!4v1715879649881!5m2!1sen!2stt" width="100%" height="240px" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                  </div>
                  
                </div>
              </div>
              
            </div>

            <div class="col-lg-7 card border-0 shadow">
                <form action="mailto:contactme@josepadams.com" method="post" enctype="text/plain" class="card-body">
                  <div class="row g-3">
                    <div class="col-6">
                      <label for="first_name" class="form-label">First Name</label>
                      <input type="text" class="form-control form-control-lg" id="first_name" name="first_name" required>
                    </div>
                    <div class="col-6">
                      <label for="last_name" class="form-label">Last Name</label>
                      <input type="text" class="form-control form-control-lg" id="last_name" name="last_name" required>
                    </div>
                    <div class="col-7">
                      <label for="subject" class="form-label">Subject</label>
                      <input type="text" class="form-control form-control-lg" id="subject" name="subject" required>
                    </div>
                    <div class="col-5">
                      <label for="email" class="form-label">Email</label>
                      <input type="email" class="form-control form-control-lg" id="email" name="email" required>
                    </div>
                    <div class="col-12">
                      <label for="message" class="form-label">Message</label>
                      <textarea class="form-control form-control-lg" id="message" name="message" rows="5" required></textarea>
                    </div>
                    <div class="col-12 d-flex justify-content-end">
                      <button type="submit" class="btn btn-lg">Send Message</button>
                    </div>
                  </div>
                </form>
            </div>
          </div>
  
        </div>
      </section>
      <!-- End Contact -->

    </main>
    <!-- End Main Content Area -->
